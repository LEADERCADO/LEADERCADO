<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KDOH Store - Accueil</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
        }

        .logo {
            font-size: 4em;
            margin-bottom: 20px;
        }

        .whatsapp-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background-color: #25D366;
            color: white;
            text-decoration: none;
            padding: 18px 40px;
            border-radius: 50px;
            font-size: 1.2em;
            font-weight: bold;
            margin: 20px 0;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.4);
            width: 100%;
            gap: 15px;
        }

        .whatsapp-btn:hover {
            background-color: #128C7E;
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(37, 211, 102, 0.6);
        }

        .whatsapp-btn:active {
            transform: translateY(-1px);
        }

        .whatsapp-icon {
            width: 30px;
            height: 30px;
            fill: white;
        }

        .email-link {
            display: block;
            color: #667eea;
            text-decoration: none;
            margin-top: 20px;
            font-size: 1.1em;
            transition: color 0.3s ease;
        }

        .email-link:hover {
            color: #764ba2;
            text-decoration: underline;
        }

        .admin-link {
            display: inline-block;
            margin-top: 30px;
            color: #999;
            text-decoration: none;
            font-size: 0.9em;
            transition: color 0.3s ease;
        }

        .admin-link:hover {
            color: #667eea;
        }

        .features {
            margin-top: 30px;
            padding-top: 30px;
            border-top: 1px solid #eee;
        }

        .feature-item {
            display: inline-block;
            margin: 10px 15px;
            color: #666;
            font-size: 0.95em;
        }

        .feature-icon {
            font-size: 1.5em;
            display: block;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🛍️</div>
        <h1>KDOH Store</h1>
        <p class="subtitle">Votre boutique e-commerce nouvelle génération</p>

        <!-- Bouton WhatsApp -->
        <a href="https://wa.me/50941310565" target="_blank" class="whatsapp-btn">
            <svg class="whatsapp-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512">
                <path d="M380.9 97.1C339 55.1 283.2 32 223.9 32c-122.4 0-222 99.6-222 222 0 39.1 10.2 77.3 29.6 111L0 480l121.7-31.9c32.4 17.7 68.9 27 106.1 27h.1c122.3 0 224.1-99.6 224.1-222 0-59.3-25.2-115-67.1-157zm-157 341.6c-33.2 0-65.7-8.9-94-25.7l-6.7-4-69.8 18.3L72 359.2l-4.4-7c-18.1-28.9-27.7-62.4-27.7-96.4 0-101.5 82.8-184.2 184.2-184.2 49.3 0 95.6 19.2 130.4 54.1 34.8 34.9 56.2 81.2 56.1 130.5 0 101.8-84.9 184.9-186.7 184.9zm101.2-138.2c-5.5-2.8-32.8-16.2-37.9-18-5.1-1.9-8.8-2.8-12.5 2.8-3.7 5.6-14.3 18-17.6 21.8-3.2 3.7-6.5 4.2-12 1.4-32.6-16.3-54-29.1-75.5-66-5.7-9.8 5.7-9.1 16.3-30.3 1.8-3.7.9-6.9-.5-9.7-1.4-2.8-12.5-30.1-17.1-41.2-4.5-10.8-9.1-9.3-12.5-9.5-3.2-.2-6.9-.2-10.6-.2-3.7 0-9.7 1.4-14.8 6.9-5.1 5.6-19.4 19-19.4 46.3 0 27.3 19.9 53.7 22.6 57.4 2.8 3.7 39.1 59.7 94.8 83.8 35.2 15.2 49 16.5 66.6 13.9 10.7-1.6 32.8-13.4 37.4-26.4 4.6-13 4.6-24.1 3.2-26.4-1.3-2.5-5-3.9-10.5-6.6z"/>
            </svg>
            Contactez-nous sur WhatsApp
        </a>

        <!-- Lien Email -->
        <a href="mailto:leadercado@gmail.com" class="email-link">
            ✉️ leadercado@gmail.com
        </a>

        <!-- Fonctionnalités -->
        <div class="features">
            <div class="feature-item">
                <span class="feature-icon">🚀</span>
                Livraison rapide
            </div>
            <div class="feature-item">
                <span class="feature-icon">💎</span>
                Produits de qualité
            </div>
            <div class="feature-item">
                <span class="feature-icon">🔒</span>
                Paiement sécurisé
            </div>
        </div>

        <!-- Lien Admin -->
        <a href="/admin.html" class="admin-link">
            🔐 Espace Administrateur
        </a>
    </div>
</body>
</html>
